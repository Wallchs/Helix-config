[[language]]
name = "python"
language-servers = [ "pyright"  ]
formatter = {command = "pyright", args = ["--stdin"]}
auto-format = true
comment-token = "#"


[[language]]
name = "javascript"
language-servers = [ "typescript-language-server" ]
auto-format = true

[[language]]
name = "typescript"
language-servers = [ "typescript-language-server" ]
auto-format = true

[[language]]
name = "jsx"
language-servers = [ "typescript-language-server", "tailwindcss-ls" ]
auto-format = true

[[language]]
name = "tsx"
language-servers = [ "typescript-language-server", "tailwindcss-ls" ]
auto-format = true


# [language-servers.emmet-ls]
# args = ["--stdio"]
# command = "emmet-ls"

# [[language]]
# name = "html"
# language-servers = ["vscode-html-language-server", "emmet-ls"]
#
[language-server.emmet-lsp]
command = "emmet-language-server"
args = ["--stdio"]

[[language]]
name = "tsx"
formatter = { command = "prettier", args = ["--parser", "typescript"] }
language-servers = ["typescript-language-server", "emmet-lsp"]

# https://github.com/olrtg/emmet-language-server?tab=readme-ov-file#helix
[[language]]
name = "html"
roots = [".git"]
formatter = { command = "prettier", args = ["--parser", "html"] }
language-servers = ["vscode-html-language-server", "emmet-lsp"]
